<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V.A.U.L.T — Test Environment</title>

  <!-- Modular Styles -->
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/styles.css">

  <!-- PDF.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (window['pdfjs-dist/build/pdf']) {
      window['pdfjs-dist/build/pdf'].GlobalWorkerOptions.workerSrc = 
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>
</head>
<body>

  <!-- Minimal Testing Header -->
  <header class="app-header" id="app-header">
    <div style="display: flex; align-items: center; gap: 1rem;">
      <a href="hero.html" style="font-weight: 700; text-decoration: none;">← Hero Page</a>
      <span style="font-weight: 600; color: var(--text-secondary);">| V.A.U.L.T [Testing Phase]</span>
    </div>

    <div class="header-actions">
      <!-- Essential: Upload Document Button -->
      <button id="btn-open-upload" class="btn btn-primary" type="button">+ Add Document</button>
    </div>
  </header>

  <main class="view-container">

    <!-- VIEW 1: Store / Library View (Essential testing grid) -->
    <section id="library-view" style="padding: 1.5rem; max-width: 1200px; margin: 0 auto;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <h2 style="font-size: 1.25rem;">Stored Documents</h2>
        <span id="library-count-label" style="font-size: 0.85rem; color: var(--text-muted);">0 items</span>
      </div>

      <!-- Books Grid (populated dynamically) -->
      <div id="books-grid" class="books-grid"></div>

      <!-- Simple Empty State -->
      <div id="empty-state" class="empty-state" style="padding: 2.5rem 1rem;">
        <p style="color: var(--text-secondary); margin-bottom: 1rem;">No documents stored in IndexedDB yet.</p>
        <button id="btn-empty-upload" class="btn btn-primary" type="button">Upload a PDF</button>
      </div>
    </section>

    <!-- VIEW 2: Read / Study Environment (Essential testing controls) -->
    <section id="reader-view" class="hidden">
      <!-- Essential Reader Toolbar -->
      <div class="reader-toolbar">
        <div class="reader-toolbar-group">
          <button id="btn-back-library" class="btn btn-secondary" type="button">← Back</button>
          <strong id="reader-book-title" style="font-size: 0.9rem; margin-left: 0.5rem;"></strong>
        </div>

        <!-- Essential Page Navigation -->
        <div class="reader-toolbar-group">
          <button id="btn-prev-page" class="btn btn-secondary btn-icon" type="button" title="Previous Page">‹</button>
          <span style="font-size: 0.85rem;">
            Page <input type="number" id="page-num-input" class="page-input" value="1" min="1" style="width: 48px; text-align: center;"> / <span id="page-count">0</span>
          </span>
          <button id="btn-next-page" class="btn btn-secondary btn-icon" type="button" title="Next Page">›</button>
        </div>

        <!-- Essential Feature Buttons: Zoom, Bookmarks, Focus Mode -->
        <div class="reader-toolbar-group">
          <!-- Zoom Controls -->
          <div style="display: flex; align-items: center; gap: 0.25rem; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 0.1rem 0.35rem;">
            <button id="btn-zoom-out" class="btn-icon" style="width: 28px; height: 28px;" type="button" title="Zoom Out (−)">−</button>
            <span id="zoom-level-label" style="font-size: 0.75rem; font-weight: 600; min-width: 38px; text-align: center;">100%</span>
            <button id="btn-zoom-in" class="btn-icon" style="width: 28px; height: 28px;" type="button" title="Zoom In (+)">+</button>
            <button id="btn-zoom-reset" class="btn-secondary" style="font-size: 0.75rem; padding: 0.15rem 0.4rem; border-radius: var(--radius-sm);" type="button" title="Reset Zoom">Fit</button>
          </div>

          <button id="btn-toggle-bookmark" class="btn btn-secondary" type="button">★ Bookmark Page</button>
          <button id="btn-toggle-focus" class="btn btn-secondary" type="button">Focus Mode</button>
        </div>
      </div>

      <!-- Reader Body: Canvas & Functional Side Panels -->
      <div class="reader-workspace">
        <!-- Centered PDF Canvas Viewport -->
        <div class="canvas-viewport" id="canvas-viewport">
          <canvas id="pdf-canvas"></canvas>
        </div>

        <!-- Direct Testing Side Workbench (Bookmarks & Notes) -->
        <aside class="reader-workbench" style="width: 320px; display: flex; flex-direction: column; padding: 1rem; gap: 1.5rem; overflow-y: auto;">
          <!-- Bookmarks Section -->
          <div>
            <div style="font-weight: 600; font-size: 0.85rem; margin-bottom: 0.5rem; display: flex; justify-content: space-between;">
              <span>Bookmarks</span>
            </div>
            <ul id="bookmarks-list" class="bookmarks-list" style="max-height: 150px; overflow-y: auto;">
              <!-- Dynamic bookmarks list -->
            </ul>
          </div>

          <!-- Notes Section -->
          <div style="display: flex; flex-direction: column; flex: 1;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
              <span style="font-weight: 600; font-size: 0.85rem;">Document Notes</span>
              <span id="notes-status" style="font-size: 0.75rem; color: var(--text-muted);">Auto-saved</span>
            </div>
            <textarea id="notes-editor" class="notes-textarea" style="flex: 1; min-height: 200px;" placeholder="Write notes here..."></textarea>
          </div>
        </aside>
      </div>

      <!-- Floating Exit Focus Button -->
      <button id="btn-exit-focus" class="btn btn-secondary exit-focus-btn" type="button">
        Exit Focus Mode
      </button>
    </section>

  </main>

  <!-- Essential Upload Dialog / Form -->
  <div id="upload-modal" class="modal-overlay hidden">
    <div class="modal-card" style="max-width: 460px;">
      <div class="modal-header">
        <h3 style="font-size: 1rem; font-weight: 600;">Add Document to Vault</h3>
        <button id="btn-close-modal" class="btn-icon modal-close-btn" type="button">✕</button>
      </div>

      <form id="upload-form">
        <div class="modal-body" style="gap: 1rem; padding: 1.25rem;">
          <div class="form-group">
            <label for="book-title-input">Title *</label>
            <input type="text" id="book-title-input" class="form-input" placeholder="Document title" required>
          </div>

          <div class="form-group">
            <label for="book-desc-input">Description</label>
            <textarea id="book-desc-input" class="form-textarea" rows="2" placeholder="Short description"></textarea>
          </div>

          <div class="form-group">
            <label for="book-cover-input">Cover Image <span style="font-weight: normal; font-size: 0.75rem; color: var(--text-muted);">(Square 1:1 ratio recommended)</span></label>
            <div class="cover-upload-container">
              <div class="cover-preview" id="cover-preview-box">1:1</div>
              <input type="file" id="book-cover-input" class="form-input" accept="image/*">
            </div>
          </div>

          <div class="form-group">
            <label for="book-file-input">PDF File *</label>
            <input type="file" id="book-file-input" class="form-input" accept="application/pdf" required>
          </div>
        </div>

        <div class="modal-footer" style="padding: 1rem 1.25rem;">
          <button type="button" id="btn-cancel-modal" class="btn btn-secondary">Cancel</button>
          <button type="submit" id="btn-submit-book" class="btn btn-primary">Save to IndexedDB</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Entry Scripts -->
  <script type="module" src="js/db.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
