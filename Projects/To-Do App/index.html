<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="jumbotron text-center w-100">
        <div class="container">
          <h1 class="jumbotron-heading" style="color: black;">Collective</h1>
          <p class="lead text-muted" style="font-style: italic;">A minimalist collection of your next steps.</p>
          
        </div>
    </section>
    
    <div class="todo-container">
        <h1>to-do</h1>
        <div class="input-container">
            <input type="text" id="task-input" placeholder="Whats on your Mind..?">
            <button id="add-btn">Submit</button>
        </div>
        <ol id="task-list">
            <!-- Tasks will be added here dynamically -->
        </ol>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
