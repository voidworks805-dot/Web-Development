<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <div class="modes">
      <button type="button" class="mode-btn active" id="pomodoro-btn">Pomodoro</button>
      <button type="button" class="mode-btn" id="short-break-btn">Short Break</button>
      <button type="button" class="mode-btn" id="long-break-btn">Long Break</button>
    </div>
    <div id="timer">25:00</div>
    <button type="button" id="start-btn">Start</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
